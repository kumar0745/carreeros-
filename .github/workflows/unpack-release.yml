name: Expand CareerOS release archive

on:
  push:
    branches: [main]
    paths:
      - "release-artifacts/READY"

permissions:
  contents: write

concurrency:
  group: careeros-release-unpack
  cancel-in-progress: false

jobs:
  unpack-source:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Reconstruct and publish the validated source tree
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="release-artifacts"
          if [[ ! -f "$artifact_dir/READY" ]]; then
            echo "Release marker absent; nothing to unpack."
            exit 0
          fi

          archive="/tmp/Pavan_CareerOS_Final_Stages_1-5.zip"
          cat "$artifact_dir"/part-*.b64 | base64 --decode > "$archive"
          unzip -tq "$archive"
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir" "$archive"' EXIT
          unzip -q "$archive" -d "$temp_dir"
          test -d "$temp_dir/pavan-careeros"
          cp -a "$temp_dir/pavan-careeros/." .
          rm -rf "$artifact_dir"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Source tree already matches the archive."
            exit 0
          fi
          git commit -m "Publish consolidated Pavan CareerOS stages 1–5"
          git push origin "HEAD:${GITHUB_REF_NAME}"
